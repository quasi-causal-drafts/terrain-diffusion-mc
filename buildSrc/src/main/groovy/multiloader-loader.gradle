plugins {
    id 'multiloader-common'
}

sourceSets {
    main {
        java.srcDir project(':common').file('src/main/java')
        resources.srcDir project(':common').file('src/main/resources')
    }
}

// Fabric uses Loom's splitEnvironmentSourceSets() and wires common client code into
// sourceSets.client from fabric/build.gradle. Forge and NeoForge do not split client
// classes by default, so they must compile/package the common client mixins from main.
if (project.name != 'fabric') {
    sourceSets {
        main {
            java.srcDir project(':common').file('src/client/java')
            resources.srcDir project(':common').file('src/client/resources')
        }
    }
}

def terrainDiffusionBuildVariant = {
    return project.ext.has('terrainDiffusionBuildVariant')
            ? project.ext.terrainDiffusionBuildVariant
            : rootProject.ext.terrainDiffusionBuildVariant(project)
}

def modelRepositorySlug = 'xandergos/terrain-diffusion-30m-onnx'
def modelRepositoryRevision = 'ad2df557eca5645f588766101cf3bc3682455c3e'
def generatedManifestFile = layout.buildDirectory.file('generated/model-assets/model-assets-manifest.json')

tasks.register('generateModelAssetManifest') {
    inputs.property('modelRepositorySlug', modelRepositorySlug)
    inputs.property('modelRepositoryRevision', modelRepositoryRevision)
    outputs.file(generatedManifestFile)

    doLast {
        File manifestFile = generatedManifestFile.get().asFile
        manifestFile.parentFile.mkdirs()

        String apiUrl = "https://huggingface.co/api/models/${modelRepositorySlug}/revision/${modelRepositoryRevision}?blobs=true"
        Map modelInfo = new groovy.json.JsonSlurper().parseText(new URL(apiUrl).getText('UTF-8')) as Map
        List siblings = modelInfo.siblings as List

        List<String> requiredFiles = [
                'base_model.onnx',
                'coarse_model.onnx',
                'decoder_model.onnx',
                'pipeline_data.json',
                'world_pipeline_config.json'
        ]

        Map<String, Object> assetEntries = [:]
        for (String requiredFileName : requiredFiles) {
            Map siblingEntry = siblings.find { it.rfilename == requiredFileName } as Map
            if (siblingEntry == null) {
                throw new GradleException("Required model asset missing from HF commit ${modelRepositoryRevision}: ${requiredFileName}")
            }

            String resolveUrl = "https://huggingface.co/${modelRepositorySlug}/resolve/${modelRepositoryRevision}/${requiredFileName}?download=true"
            long expectedSizeBytes = ((Number) siblingEntry.size).longValue()
            String expectedSha256
            if (siblingEntry.lfs instanceof Map && siblingEntry.lfs.sha256 != null) {
                expectedSha256 = siblingEntry.lfs.sha256 as String
            } else {
                byte[] remoteFileBytes = new URL(resolveUrl).bytes
                expectedSha256 = terrainDiffusionSha256Hex(remoteFileBytes)
            }

            assetEntries[requiredFileName] = [
                    sha256  : expectedSha256,
                    sizeBytes: expectedSizeBytes,
                    url     : resolveUrl
            ]
        }

        Map<String, Object> manifestPayload = [
                repositorySlug: modelRepositorySlug,
                revision      : modelRepositoryRevision,
                assets        : assetEntries
        ]
        manifestFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(manifestPayload))
    }
}

// The DirectML build of onnxruntime.dll delay-loads DirectML.dll but libs/onnxruntime-dml.jar does not ship it,
// so Windows falls back to its inbox System32 copy, which on Windows 10 is too old (DMLCreateDevice1 fails with
// 0x887A0004). Bundle the official redistributable from NuGet in the Windows variant; DirectMLRuntime loads it.
// Keep the version in step with the DirectML version ONNX Runtime was built against (1.26.0 -> 1.15.4).
def directMLVersion = (findProperty('directml_version') ?: '1.15.4').toString()
def directMLNupkgSha512 = (findProperty('directml_nupkg_sha512') ?: '').toString().trim()
def directMLCacheDir = rootProject.file(".gradle/directml/${directMLVersion}")
def directMLGeneratedDir = layout.buildDirectory.dir('generated/directml')

if (terrainDiffusionBuildVariant() == 'windows') {
    def prepareDirectMLRuntime = tasks.register('prepareDirectMLRuntime') {
        inputs.property('directMLVersion', directMLVersion)
        inputs.property('directMLNupkgSha512', directMLNupkgSha512)
        outputs.dir(directMLGeneratedDir)

        doLast {
            String packageFileName = "microsoft.ai.directml.${directMLVersion}.nupkg"
            File nupkg = new File(directMLCacheDir, packageFileName)
            if (!nupkg.isFile()) {
                directMLCacheDir.mkdirs()
                String url = "https://api.nuget.org/v3-flatcontainer/microsoft.ai.directml/${directMLVersion}/${packageFileName}"
                logger.lifecycle("Downloading DirectML ${directMLVersion} redistributable from ${url}")
                File partial = new File(directMLCacheDir, packageFileName + '.part')
                partial.withOutputStream { output -> new URL(url).withInputStream { input -> output << input } }
                if (!partial.renameTo(nupkg)) {
                    throw new GradleException("Could not move ${partial} to ${nupkg}")
                }
            }

            // NuGet publishes package hashes as base64 SHA-512, so use the same form to make pinning easy.
            String actualSha512 = java.util.Base64.getEncoder().encodeToString(
                    java.security.MessageDigest.getInstance('SHA-512').digest(nupkg.bytes))
            if (directMLNupkgSha512) {
                if (actualSha512 != directMLNupkgSha512) {
                    nupkg.delete()
                    throw new GradleException("DirectML package hash mismatch: expected ${directMLNupkgSha512}, got ${actualSha512}")
                }
            } else {
                logger.lifecycle("DirectML ${directMLVersion} package SHA-512 (base64): ${actualSha512}. " +
                        "Set directml_nupkg_sha512 in gradle.properties to pin it.")
            }

            File outputDir = directMLGeneratedDir.get().asFile
            outputDir.deleteDir()
            File nativeDir = new File(outputDir, 'terrain-diffusion-mc/native/win-x64')
            File licenseDir = new File(outputDir, 'META-INF/directml')
            nativeDir.mkdirs()
            licenseDir.mkdirs()

            def zip = new java.util.zip.ZipFile(nupkg)
            try {
                def zipEntries = Collections.list(zip.entries())
                def dllEntry = zipEntries.find { it.name.equalsIgnoreCase('bin/x64-win/DirectML.dll') }
                if (dllEntry == null) {
                    throw new GradleException("bin/x64-win/DirectML.dll not found in ${nupkg}")
                }
                zip.getInputStream(dllEntry).withStream { input ->
                    new File(nativeDir, 'DirectML.dll').withOutputStream { it << input }
                }
                new File(nativeDir, 'directml-version.txt').text = directMLVersion

                // The redistributable's license terms travel with the DLL.
                zipEntries.findAll {
                    !it.directory && !it.name.contains('/') && it.name.toLowerCase(Locale.ROOT) ==~ /(license|thirdpartynotices).*\.txt/
                }.each { entry ->
                    zip.getInputStream(entry).withStream { input ->
                        new File(licenseDir, entry.name).withOutputStream { it << input }
                    }
                }
            } finally {
                zip.close()
            }
        }
    }

    processResources {
        dependsOn prepareDirectMLRuntime
        from(directMLGeneratedDir)
    }
}

// Commit the jar was built from, logged at startup so a log shows exactly which build is running.
def terrainDiffusionBuildCommit = (System.getenv('GITHUB_SHA') ?: 'local').take(7)

processResources {
    dependsOn tasks.named('generateModelAssetManifest')
    inputs.property('terrain_diffusion_build_variant', terrainDiffusionBuildVariant())
    inputs.property('terrain_diffusion_build_commit', terrainDiffusionBuildCommit)
    from(generatedManifestFile) {
        into ''
    }
    filesMatching('build-variant.properties') {
        expand 'build_variant': terrainDiffusionBuildVariant(), 'build_commit': terrainDiffusionBuildCommit
    }
}

dependencies {
    compileOnly(project(':common')) {
        capabilities {
            requireCapability "$group:$mod_id"
        }
        def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
        attributes {
            attribute(loaderAttribute, 'common')
        }
    }
}

String terrainDiffusionSha256Hex(byte[] fileBytes) {
    java.security.MessageDigest messageDigest = java.security.MessageDigest.getInstance('SHA-256')
    byte[] digestBytes = messageDigest.digest(fileBytes)
    StringBuilder hexBuilder = new StringBuilder(digestBytes.length * 2)
    for (byte digestByte : digestBytes) {
        hexBuilder.append(String.format('%02x', digestByte))
    }
    return hexBuilder.toString()
}
