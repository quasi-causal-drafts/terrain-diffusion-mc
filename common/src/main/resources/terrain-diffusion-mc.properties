# Terrain Diffusion MC configuration

# Inference device: "cpu", "gpu", or "auto" (try GPU first then fall back to CPU).
# Ignored for the CPU build.
inference.device=gpu

# Which GPU DirectML runs on (Windows build only).
# "auto" picks the high-performance GPU, so PCs with integrated graphics use the dedicated card.
# Set a number (0, 1, ...) to force a specific adapter index instead.
inference.gpu_device_id=auto

# Biomes Terrain Diffusion worlds may use. Leave empty for the default set. Entries, separated by commas:
#   default             everything Terrain Diffusion places out of the box (vanilla biomes, its own sparse
#                       forests, and Terralith's biomes when Terralith is installed)
#   minecraft:plains    one biome; vanilla, Terrain Diffusion and Terralith biomes can drop the "namespace:"
#   biomesoplenty:*     every overworld surface biome from a mod (no caves, rivers, beaches, Nether or End)
#   -moonlight_grove    remove a biome (or -terralith:* to remove a whole mod)
# Biomes Terrain Diffusion has no rules for go where their climate fits and share that area with the biome
# normally there. A vanilla biome that isn't listed is replaced by the closest listed one. Example:
#   biomes.allowed=default, biomesoplenty:*, -moonlight_grove, -moonlight_valley
# Takes effect after a restart, in newly generated chunks. Problems are reported in the log.
biomes.allowed=

# Offload inactive models from VRAM so only one model occupies the GPU at a time.
# Keeps peak VRAM to 1.5-2 GB. Set to false if you have ~2.5+ GB of free VRAM for
# slightly faster generation (avoids reloading sessions between pipeline stages).
inference.offload_models=true

# Validate SHA-256 for pre-existing files in .minecraft/terrain-diffusion-models.
# Set to false to allow custom user-provided models/config without hash checks.
validate_model=true

# Port for the local terrain explorer web UI (started with /td-explore command).
explorer.port=19801

# Terrain generation region side length in blocks. Must be a power of 2.
# Examples: 128, 256, 512, 1024.
# Use larger values to generate in larger batches (more chunks per second)
# Use smaller values to generate in smaller batches (most responsive)
tile_size=256

# Spawn search: coarse-pixel region sizes for land detection near (0,0).
# Starts at initial_size x initial_size, expands by 8 each iteration up to max_size x max_size.
spawn_search.initial_size=16
spawn_search.max_size=128