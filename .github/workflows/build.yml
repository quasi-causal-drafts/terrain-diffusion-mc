name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: windows
            flag: ""
          - variant: cuda
            flag: "-PuseCuda=true"
          - variant: cpu
            flag: "-PuseCpu=true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build Forge and Fabric jars
        run: ./gradlew :forge:build :fabric:build ${{ matrix.flag }} --stacktrace

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: terrain-diffusion-mc-${{ matrix.variant }}-1.20.1
          if-no-files-found: error
          path: |
            forge/build/libs/*.jar
            fabric/build/libs/*.jar
            !**/*-sources.jar
            !**/*-javadoc.jar
